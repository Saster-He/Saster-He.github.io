{{ define "main" }}
<article class="wrap page">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <section class="entries">
    {{ range .Pages.ByDate.Reverse }}
    <article class="entry">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p class="meta"><time datetime="{{ .Date.Format "2006-01" }}">{{ .Date.Format "Jan 2006" }}</time></p>
      {{ with .Params.summary }}<div class="entry-text"><p>{{ . }}</p></div>{{ end }}
    </article>
    {{ end }}
  </section>
</article>
{{ end }}
