baseURL: https://saster-he.github.io/
title: Jie He
languageCode: en-US
enableRobotsTXT: true
disableKinds: [taxonomy, term, RSS]

markup:
  goldmark:
    extensions:
      typographer:
        disable: false
    parser:
      attribute:
        block: true   # lets content add a class to a paragraph, e.g. {.action} in cv.md

imaging:
  resampleFilter: Lanczos
